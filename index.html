<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<title>Roshi AI</title>
<style>
body {font-family: Arial; background: #667eea; text-align:center; padding:20px;}
.box {background:white; color:#333; max-width:600px; margin:auto; padding:20px; border-radius:15px;}
input {width:65%; padding:10px; border-radius:8px; border:1px solid #667eea;}
button {padding:10px 20px; background:#667eea; color:white; border:none; border-radius:8px; cursor:pointer;}
#reply {margin-top:15px; padding:10px; background:#f0f0ff; border-radius:8px; text-align:left; min-height:80px;}
</style>
</head>
<body>
  <div class="box">
    <h1>🤖 Roshi AI</h1>
    <input type="text" id="userInput" placeholder="Sawal likhen...">
    <button id="sendBtn">Send</button>
    <div id="reply">Mai jawab dunga</div>
  </div>

<script>
const API_KEY "AQ.Ab8RN6KjcraihsS"
"IEVkaEBooilNF8vUP2"
"aZKiwCpSbO50NIahg";

document.getElementById("sendBtn").onclick = async function() {
  let msg = document.getElementById("userInput").value;
  let replyBox = document.getElementById("reply");
  if(msg.trim() === "") return;

  replyBox.innerHTML = "Roshi soch raha hai... 🤔";
  document.getElementById("userInput").value = "";

  try {
    let response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + API_KEY, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({contents: [{parts: [{text: "Urdu mai jawab do: " + msg}]}]})
    });

    let data = await response.json();
    replyBox.innerHTML = "<b>Roshi:</b> " + data.candidates[0].content.parts[0].text;

  } catch(error) {
    replyBox.innerHTML = "Error: Key ghalat hai ya internet slow hai";
  }
}
</script>
</body>
</html>
