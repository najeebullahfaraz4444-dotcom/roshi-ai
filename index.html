<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roshi AI - Your Smart Assistant</title>
<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  text-align:center; padding:20px; color:white; min-height:100vh;
}
.box {background:white; color:#333; max-width:600px; margin:auto; padding:30px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.3);}
h1 {color:#667eea; font-size:32px;}
input {width:80%; padding:12px; border-radius:10px; border:2px solid #667eea; font-size:16px;}
button {padding:12px 25px; background:#667eea; color:white; border:none; border-radius:10px; margin-top:15px; cursor:pointer; font-size:16px; font-weight:bold;}
button:hover {background:#764ba2;}
</style>
</head>
<body>
  <div class="box">
    <h1>🤖 Roshi AI</h1>
    <p>Your Smart Assistant is Ready</p>
    <input type="text" placeholder="Yahan kuch likhen...">
    <br>
    <button>Send</button>
  </div>
</body>
</html>
