<!doctype html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Roshi AI</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Arabic",sans-serif;background:#f5f7fb;color:#18202a}
    .app{max-width:760px;margin:auto;height:100vh;display:flex;flex-direction:column;background:white}
    header{padding:18px 20px;border-bottom:1px solid #e6e9ef;display:flex;align-items:center;gap:12px}
    .logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#111827;color:white;font-weight:800}
    h1{font-size:20px;margin:0}.sub{font-size:12px;color:#6b7280}
    #chat{flex:1;overflow:auto;padding:20px}.msg{max-width:85%;padding:12px 15px;border-radius:16px;margin:10px 0;white-space:pre-wrap;line-height:1.6}
    .user{margin-right:auto;background:#111827;color:white;border-bottom-right-radius:5px}
    .bot{margin-left:auto;background:#eef1f6;border-bottom-left-radius:5px}
    form{display:flex;gap:8px;padding:14px;border-top:1px solid #e6e9ef}
    textarea{flex:1;resize:none;border:1px solid #d8dde6;border-radius:14px;padding:12px;font:inherit;min-height:48px;max-height:130px}
    button{border:0;border-radius:14px;padding:0 18px;background:#111827;color:white;font-weight:700;cursor:pointer}
    button:disabled{opacity:.5}
    .hint{text-align:center;color:#8a93a3;font-size:12px;padding:0 15px 8px}
  </style>
</head>
<body>
<div class="app">
  <header><div class="logo">R</div><div><h1>Roshi AI</h1><div class="sub">آپ کا ذاتی AI اسسٹنٹ</div></div></header>
  <main id="chat"></main>
  <div class="hint">Roshi AI غلطی کر سکتا ہے؛ اہم معلومات کی تصدیق کریں۔</div>
  <form id="form">
    <textarea id="input" placeholder="اپنا سوال لکھیں..." rows="1"></textarea>
    <button id="send" type="submit">بھیجیں</button>
  </form>
</div>
<script>
const chat=document.getElementById("chat"), form=document.getElementById("form"),
input=document.getElementById("input"), send=document.getElementById("send");
function add(text, cls){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
add("السلام علیکم! میں Roshi AI ہوں۔ آپ کیا پوچھنا چاہتے ہیں؟","bot");
form.addEventListener("submit",async e=>{
  e.preventDefault(); const message=input.value.trim(); if(!message)return;
  add(message,"user"); input.value=""; send.disabled=true;
  const wait=add("سوچ رہا ہوں…","bot");
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});
    const data=await r.json(); wait.textContent=data.reply||data.error||"جواب نہیں ملا۔";
  }catch{wait.textContent="سرور سے رابطہ نہیں ہو سکا۔";}
  finally{send.disabled=false;input.focus();}
});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
</script>
</body>
</html>
